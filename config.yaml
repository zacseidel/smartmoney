# Congressional Trades Tracker configuration

http:
  # A descriptive User-Agent is required by the House Clerk, Senate eFD, and SEC EDGAR.
  user_agent: "CongressTradesTracker/1.0 (contact: zachary.seidel@gmail.com)"
  rate_limit_delay_ms: 400      # polite delay between House/Senate requests
  max_retries: 3
  timeout_seconds: 30

polygon:
  rate_limit_calls_per_min: 5   # free tier
  details_ttl_days: 180         # company description/profile — rarely changes, recheck ~every 6 months
  financials_ttl_days: 90       # PolygonClient.financials only. Stock pages read EDGAR.
  aggregates_ttl_days: 7        # retry interval for empty one-time history backfills
  news_limit: 5
  news_ttl_days: 14             # recent-news cache — headlines go stale after ~2 weeks
  news_refresh_max: 40          # max stale-news refreshes per run (relevant tickers only)
  chart_lookback_days: 730      # 2 years
  max_enrichment_tickers: 60    # safety cap per run (free-tier budget)

edgar:
  # Stock-page annuals (revenue, income, EPS, assets, equity) come from the SEC
  # company-facts feed. 8/sec stays under the 10/sec fair-access ceiling.
  facts_ttl_days: 30
  tickers_ttl_days: 7
  rate_limit_per_sec: 8
  financials_refresh_max: 2000  # per run; a full book is a couple of minutes

pipeline:
  lookback_days: 730            # trailing 2-year window for filings + returns
  benchmark_ticker: "SPY"

dashboard:                      # combined Smart Money dashboard (docs/index.html)
  congress_window_days: 120     # a congressional purchase counts as "recent" within this window
  top_funds_n: 200              # only new buys from the top-N funds by alpha count (skill, not consensus)
  min_fund_alpha: 0.0           # ...and only funds that actually beat SPY

# --- Hedge (13F institutional-holdings) report ------------------------------- #
openfigi:
  # CUSIP->ticker resolver. Unauthenticated: ~25 req/min, <=10 jobs/request.
  # Set OPENFIGI_API_KEY (free at openfigi.com/api) to auto-use the keyed_* limits
  # below — ~125x faster, turning a cold full-universe resolve from ~90 min into ~1 min.
  rate_limit_calls_per_min: 20
  batch_size: 10
  keyed_rate_calls_per_min: 250   # used automatically when OPENFIGI_API_KEY is set
  keyed_batch_size: 100

hedge:
  # Candidate selection: a CONCENTRATION + SIZE band, not top-by-AUM. Alpha lives in
  # concentrated active bets, which are anti-correlated with size — ranking by AUM
  # systematically misses small high-alpha funds (e.g. Ratan Capital, $0.27B/+31%).
  # Selecting uses cached holdings-counts (aum_index), so it costs zero extra fetches.
  min_aum: 100000000            # $100M floor — a real, liquid fund
  min_holdings: 5               # exclude near-empty / single-name filers
  max_holdings: 150             # exclude closet-indexers / diversified funds (custodians already gone)
  candidate_pool_size: 6000     # hard safety cap on the band (by AUM) to bound a run
  pool_pins: [1566887]          # always in the fetch universe even outside the holdings band (Ratan)
  leaderboard_size: 500         # funds shown on the alpha leaderboard
  stock_pages_drivers: 120      # render per-stock pages for the top-N alpha contributors...
  stock_pages_buys: 120         # ...and the top-N skill-weighted new buys (so linked tickers have pages)
  specialist_overlap_size: 30  # shared latest holdings shown below the pinned-specialist table
  watchlist_size: 40            # top funds promoted to deep per-fund pages
  watchlist_pins: []            # extra CIKs always kept on the watchlist (labels live in watchlist_funds)
  watchlist_funds:              # general high-conviction pins; NOT mixed into healthcare specialist overlap
    - cik: 1562087
      label: "Thiel Macro"
    - cik: 2045724
      label: "Situational Awareness"
    - cik: 1536411
      label: "Duquesne Family Office"
    - cik: 1765681
      label: "Thrive Capital"
    - cik: 1777813
      label: "Atreides Management"
    - cik: 1649339
      label: "Scion"
    - cik: 1566887
      label: "Ratan Capital"
  specialist_funds:             # curated funds stay visible even when data-quality gates exclude them
    - cik: 1224962
      label: "Perceptive Advisors"
      category: "Healthcare"
    - cik: 1595855
      label: "Opaleye"
      category: "Healthcare"
    - cik: 1727492
      label: "Caligan Partners"
      category: "Healthcare"
    - cik: 1907884
      label: "Kynam"
      category: "Healthcare"
    - cik: 1802630
      label: "Soleus Capital"
      category: "Healthcare"
  passive_blocklist:            # mega passive managers excluded from the pool (by name substring)
    - "VANGUARD"
    - "BLACKROCK"
    - "STATE STREET"
    - "GEODE"
    - "FMR "                    # Fidelity
  min_filings: 4                # a fund needs >= this many 13F-HR in-window to be rankable
  min_coverage: 0.90            # >= this fraction of portfolio value must be priced to rank
  min_hit_rate: 0.50            # require > this share of quarters beat SPY (a ratio, not a
                                # quarter count) — drops one-lucky-quarter flukes without forcing 8q
  change_threshold: 0.15        # min |Q/Q share change| to count as an increase/decrease (diff_holdings)
  fetch_workers: 8              # concurrent EDGAR fetch threads (shared throttle keeps under 10 req/s)

scoring:
  # A member must have at least this many resolved positions to appear ranked.
  min_positions_to_rank: 3
  # "Out-performer" = top `outperformer_top_quantile` of rankable members by dollar-weighted
  # alpha, AND alpha must exceed `outperformer_min_alpha`. (Intersection, not union.)
  outperformer_min_alpha: 0.0   # alpha must beat SPY by more than this (dollar-weighted)
  outperformer_top_quantile: 0.25  # only the top quartile by alpha qualify

report:
  leaderboard_size: 40          # members shown on the leaderboard
  description_max_chars: 600
  whats_new_window_days: 20     # "What's new"/digest shows trades disclosed within this many days
  drivers_size: 40              # stocks shown in "drove out-performance" (View A)
  recent_buys_size: 40          # stocks shown in "buying now" (View B)
  view_b_window_days: 30        # a purchase counts as "now" if disclosed within this many days
  news_relevant_days: 120       # a ticker is "relevant" for news refresh if disclosed within this window

ocr:
  max_filings_per_run: 12       # scanned House PTRs to OCR per run (~2 min each; bounds the
                                # dedicated ocr.yml run to ~25 min, drains the backlog daily)
  dpi: 300                      # render resolution for OCR
  workers: 4                    # filings OCR'd concurrently (tesseract/poppler release the GIL).
                                # Raise toward core count locally; keep modest on CI runners.
  # Match threshold lives in src/ocr_ptr.py (MATCH_CUTOFF = 0.86).

graph:
  feed_size: 150                # rows in the "regulated bets" signal feed
  cap_buckets:                  # lower bound (USD) for each market-cap bucket
    mega: 200000000000
    large: 10000000000
    mid: 2000000000
    small: 300000000
  signal:                       # "interestingness" composite weights
    cap_multiplier: {micro: 3.0, small: 2.5, mid: 1.5, large: 1.1, mega: 1.0, unknown: 1.0}
    committee_boost: 3.0        # multiplier when the industry is in the member's committee jurisdiction
    consensus_step: 0.5         # +0.5 per additional member buying the same ticker
  network:
    max_members: 25             # members shown in the interactive network (people-first)
    edges_per_member: 3         # each member links to their top-N industries by dollars
